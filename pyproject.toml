[project]
name = "chartink-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Chartink technical stock screeners"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
chartink-mcp = "chartink_mcp.server:main"
chartink-setup = "chartink_mcp.installer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
